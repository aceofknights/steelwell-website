<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback Survey</title>
    <link rel="stylesheet" href="/css/stylesheet_survey.css?v=4b" />
      <link rel="canonical" href="https://chriswellsdev.com/feedback/" />
  <meta property="og:url" content="https://chriswellsdev.com/feedback/" />
<meta property="og:title" content="Feedback Survey" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="Feedback Survey" />
</head>

  <body>
    <div class="container">
      <h1>Feedback Survey Demo</h1>
      <p class="survey-notice">This is a form demonstration, not a working contact form. Responses are not sent to Chris or saved. Please do not enter private information.</p>
      <p class="survey-notice"><a href="/">Return to ChrisWellsDev</a></p>
      <form id="surveyForm">
        <div class="question">
          <label for="userName">Your Name:</label>
          <input type="text" id="userName" name="userName" required />
        </div>
        <!-- Question 1: Multiple Choice -->
        <div class="question">
          <label for="q1">1. How would you rate your experience?</label>
          <select id="q1" name="q1">
            <option value="">Select Rating</option>
            <option value="excellent">Excellent</option>
            <option value="good">Good</option>
            <option value="average">Average</option>
            <option value="poor">Poor</option>
          </select>
        </div>

        <!-- Question 2: Text Field -->
        <div class="question">
          <label for="q2">2. What could be improved?</label>
          <input type="text" id="q2" name="q2" />
        </div>

        <!-- Question 3: Radio Buttons -->
        <div class="question">
          <label>3. How did you hear about us?</label>
          <input type="radio" id="q3a" name="q3" />
          <label for="q3a">Social Media</label>
          <input type="radio" id="q3b" name="q3" />
          <label for="q3b">Search Engine</label>
          <input type="radio" id="q3c" name="q3" />
          <label for="q3c">Friend</label>
        </div>

        <!-- Question 4: Checkbox -->
        <div class="question">
          <label>4. Which features do you like? (Select all that apply)</label>
          <input type="checkbox" id="q4a" name="q4[]" />
          <label for="q4a">Design</label>
          <input type="checkbox" id="q4b" name="q4[]" />
          <label for="q4b">Speed</label>
          <input type="checkbox" id="q4c" name="q4[]" />
          <label for="q4c">Content</label>
        </div>

        <!-- Question 5: Text Area (Optional) -->
        <div class="question optional">
          <label for="q5">5. Any additional feedback?</label>
          <textarea id="q5" name="q5"></textarea>
        </div>

        <div class="submit">
          <button type="button" id="submitBtn">Try demo</button>
        </div>
      </form>

      <!-- Error Message Container -->
      <div id="errorMessage" class="error" role="alert"></div>

      <!-- Thank You Message Container -->
      <div id="thankYouMessage" class="hidden" role="status">
        <p>Demo complete, <span id="submittedUserName"></span>. Nothing was sent or saved.</p>
      </div>
    </div>

    <script src="/javascript/script_survey.js?v=4b"></script>
  </body>
</html>
